{% extends "base.html" %}
{% block content %}
<h3>Register</h3>
<form method="post">
  Username:<br><input name="username" required><br>
  Password (minimum 6 characters):<br><input type="password" name="password" required><br>
  <button type="submit">Register</button>
</form>
<p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
{% endblock %}
